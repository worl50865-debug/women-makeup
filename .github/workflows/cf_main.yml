name: Women CAT1 – 3 group(s) [Cloudflare R2]

on:
  schedule:
    - cron: '0 3 * * *'  # Staggered daily run at 3:00 AM UTC (adjust as needed)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [women_cat1_sub1, women_cat1_sub2, women_cat1_sub3]
      max-parallel: 3
      fail-fast: false

    defaults:
      run:
        working-directory: CF   # all commands run inside the CF folder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium

      - name: Run scraper – ${{ matrix.module }}
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
        run: |
          python -m ${{ matrix.module }}.main

      - name: Job summary
        if: always()
        run: |
          echo "## ${{ matrix.module }}" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
